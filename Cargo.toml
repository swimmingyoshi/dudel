[package]
name = "dudel"
version = "0.5.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/swimmingyoshi/dudel"

[features]
# Diagnostic build only: requested Rust allocation bytes, not heap commitment/VRAM.
allocation-profile = ["windows-sys/Win32_System_Memory", "windows-sys/Win32_System_ProcessStatus", "windows-sys/Win32_System_LibraryLoader", "windows-sys/Win32_System_Threading"]
allocation-stack-profile = ["allocation-profile", "dep:rustc-demangle", "windows-sys/Win32_System_Diagnostics_Debug", "windows-sys/Win32_System_LibraryLoader"]

[dependencies]
arboard = "=3.6.1"
eframe = { version = "0.33", features = ["persistence", "wgpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustc-demangle = { version = "0.1", optional = true }
ron = { version = "=0.11.0", features = ["integer128"] }
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "webp", "bmp"] }
# Timelapse GIFs encode only the pixels that changed between frames.
gif = "0.14"
color_quant = "1"
png = "=0.18.1"
rfd = "0.15"
rhai = "1"
tempfile = "3"
flate2 = "1"
directories = "6"
wasmi = "2"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks", "limits"] }
# Already built for `image`; converts CMYK Photoshop files through their profile.
moxcms = "=0.8.1"
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }
# Already built for egui; draw text with installed fonts.
ab_glyph = "=0.2.32"
ab_glyph_rasterizer = "=0.1.10"
ttf-parser = "=0.25.1"
rustybuzz = "=0.20.1"
unicode-bidi = "=0.3.18"

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Input_Pointer", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Performance", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Globalization"] }

# Already built for egui's accessibility layer. Shortcuts, the per-user
# registry and HTTPS for the installer and the update check.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Shell"] }

# Debug builds and tests keep line numbers for backtraces and nothing else,
# and no debug information for dependencies: the symbol file is 250 MB, not
# 690 MB, and each link is 3 s shorter. For a debugger session set
# CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# For trying a change at full speed: `cargo run --profile fast`. Optimized
# like a release, but it keeps an incremental cache, so a rebuild after an
# edit takes 15 to 45 s, not 3 minutes, and it paints at the same speed
# (compared 2026-11-13). Packages are still built with `--release`.
[profile.fast]
inherits = "release"
incremental = true

[dev-dependencies]
rusqlite = { version = "=0.40.2", default-features = false, features = ["serialize"] }
wat = "1.261.0"

[[example]]
name = "dx12_upload_probe"
required-features = ["allocation-profile"]
