[workspace]
# The app (this package), its engine and its interface kit. `cargo test`,
# `cargo clippy` and `cargo build` here cover all three.
members = ["crates/dudel-core", "crates/dudel-ui"]
default-members = [".", "crates/dudel-core", "crates/dudel-ui"]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/swimmingyoshi/dudel"

# One version of each shared dependency for every crate here.
[workspace.dependencies]
ab_glyph = "=0.2.32"
ab_glyph_rasterizer = "=0.1.10"
directories = "6"
# The engine uses only egui's geometry crate, `emath`.
egui = { version = "0.33", default-features = false }
emath = "0.33"
epaint_default_fonts = "0.33"
flate2 = "1"
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "webp", "bmp"] }
moxcms = "=0.8.1"
png = "=0.18.1"
rhai = "1"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "hooks", "limits"] }
rustybuzz = "=0.20.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
ttf-parser = "=0.25.1"
unicode-bidi = "=0.3.18"
wasmi = "2"
wat = "1.261.0"
windows-sys = "0.61"

[package]
name = "dudel"
build = "src/build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Diagnostic build only: requested Rust allocation bytes, not heap commitment/VRAM.
allocation-profile = ["windows-sys/Win32_System_Memory", "windows-sys/Win32_System_ProcessStatus", "windows-sys/Win32_System_LibraryLoader", "windows-sys/Win32_System_Threading"]
allocation-stack-profile = ["allocation-profile", "dep:rustc-demangle", "windows-sys/Win32_System_Diagnostics_Debug", "windows-sys/Win32_System_LibraryLoader"]

[dependencies]
dudel-core = { path = "crates/dudel-core" }
dudel-ui = { path = "crates/dudel-ui" }
arboard = "=3.6.1"
eframe = { version = "0.33", features = ["persistence", "wgpu"] }
# Dockable palettes: tabs dragged between groups, split, floated or closed.
egui_dock = { version = "=0.18.0", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
rustc-demangle = { version = "0.1", optional = true }
ron = { version = "=0.11.0", features = ["integer128"] }
image.workspace = true
# Timelapse GIFs encode only the pixels that changed between frames.
gif = "0.14"
color_quant = "1"
png.workspace = true
rfd = "0.15"
rhai.workspace = true
tempfile.workspace = true
flate2.workspace = true
directories.workspace = true
wasmi.workspace = true
rusqlite.workspace = true
# Already built for `image`; converts CMYK Photoshop files through their profile.
moxcms.workspace = true
zip = { version = "=9.0.5", default-features = false, features = ["deflate-flate2"] }
# Already built for egui; draw text with installed fonts.
ab_glyph.workspace = true
ab_glyph_rasterizer.workspace = true
ttf-parser.workspace = true
rustybuzz.workspace = true
unicode-bidi.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Input_Pointer", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Performance", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Globalization"] }

# Already built for egui's accessibility layer. Shortcuts, the per-user
# registry and HTTPS for the installer and the update check; the video encoder.
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_Networking_WinHttp", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Shell"] }

# Debug builds and tests keep line numbers for backtraces and nothing else,
# and no debug information for dependencies: the symbol file is 250 MB, not
# 690 MB, and each link is 3 s shorter. For a debugger session set
# CARGO_PROFILE_DEV_DEBUG=full.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# For trying a change at full speed: `cargo run --profile fast`. Optimized
# like a release, but it keeps an incremental cache, so a rebuild after an
# edit takes 15 to 45 s, not 3 minutes, and it paints at the same speed
# (compared 2026-11-13). Packages are still built with `--release`.
[profile.fast]
inherits = "release"
incremental = true

[dev-dependencies]
dudel-core = { path = "crates/dudel-core", features = ["testing"] }
rusqlite = { workspace = true, features = ["serialize"] }
wat.workspace = true

[[example]]
name = "dx12_upload_probe"
required-features = ["allocation-profile"]
