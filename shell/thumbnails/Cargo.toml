# Explorer thumbnail provider for .dudel projects. Its own workspace so the
# app's lockfile and CI build are untouched; Package.ps1 builds it separately.
[package]
name = "dudel_thumbnails"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
windows-core = "0.61"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemServices",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
